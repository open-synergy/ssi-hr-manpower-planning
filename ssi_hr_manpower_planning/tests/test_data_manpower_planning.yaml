options:
  auto_refresh: true

scenarios:
  - name: "Manpower Planning - Full Workflow: draft to done"
    steps:
      - step: "Create department WF"
        action: "create"
        model: "hr.department"
        save_as: "dept"
        values:
          name: "MPP Department WF"

      - step: "Create job A WF"
        action: "create"
        model: "hr.job"
        save_as: "job_a"
        values:
          name: "MPP Job A WF"

      - step: "Create job B WF"
        action: "create"
        model: "hr.job"
        save_as: "job_b"
        values:
          name: "MPP Job B WF"

      - step: "Create employee WF"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "MPP Employee WF"
          department_id: "REC: dept.id"
          job_id: "REC: job_a.id"

      - step: "Create manpower planning"
        action: "create"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: dept.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
          formation_ids:
            - - 0
              - 0
              - job_id: "REC: job_a.id"
                employee_id: "REC: employee.id"
                quantity: 1
            - - 0
              - 0
              - job_id: "REC: job_b.id"
                quantity: 2
            - - 0
              - 0
              - job_id: "REC: job_b.id"
                quantity: 1
      - step: "Header quantities are summed from the formation lines"
        action: "assert"
        target: "planning"
        asserts:
          state:
            type: "value"
            expected: "draft"
          quantity_needed:
            type: "value"
            expected: 4
          quantity_filled:
            type: "value"
            expected: 1
          quantity_vacant:
            type: "value"
            expected: 3
      - step: "Confirm planning"
        action: "call"
        target: "planning"
        method: "action_confirm"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "confirm"
      - step: "Approve planning"
        action: "call"
        target: "planning"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "open"
      - step: "Number is issued when the planning opens"
        action: "assert"
        target: "planning"
        asserts:
          name:
            type: "value"
            operator: "not_equals"
            expected: "/"
      - step: "Mark planning as done"
        action: "call"
        target: "planning"
        method: "action_done"
        as_user: "base.user_admin"
        asserts:
          state:
            type: "value"
            expected: "done"

