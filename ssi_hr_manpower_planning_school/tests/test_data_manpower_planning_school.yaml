options:
  auto_refresh: true

scenarios:
  - name: "Manpower Planning School - Context is stored and branch follows the school"
    steps:
      - step: "Create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "grade_type"
        values:
          name: "MPP School Context Grade Type"
          code: "/"
          sequence: 10
      - step: "Create branch"
        action: "create"
        model: "school_branch"
        save_as: "branch"
        values:
          name: "MPP School Context Branch"
          code: "/"
      - step: "Create school of the branch"
        action: "create"
        model: "school"
        save_as: "school"
        values:
          name: "MPP School Context"
          code: "/"
          grade_type_id: "REC: grade_type.id"
          branch_id: "REC: branch.id"
      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "year"
        values:
          name: "MPP 2026/2027 Context"
          code: "/"
          date_start: "2026-07-01"
          date_end: "2027-06-30"
      - step: "Create curriculum"
        action: "create"
        model: "manpower_planning_curriculum"
        save_as: "curriculum"
        values:
          name: "MPP Curriculum Context"
          code: "/"
      - step: "Create department"
        action: "create"
        model: "hr.department"
        save_as: "department"
        values:
          name: "MPP School Context Department"
      - step: "Create planning with school context"
        action: "create"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department.id"
          date_start: 2026-07-01
          date_end: 2027-06-30
          school_id: "REC: school.id"
          academic_year_id: "REC: year.id"
          curriculum_id: "REC: curriculum.id"
      - step: "School, branch, year and curriculum are stored"
        action: "assert"
        target: "planning"
        asserts:
          school_id:
            type: "m2o"
            expected: "REC: school"
          school_branch_id:
            type: "m2o"
            expected: "REC: branch"
          academic_year_id:
            type: "m2o"
            expected: "REC: year"
          curriculum_id:
            type: "m2o"
            expected: "REC: curriculum"

  - name: "Manpower Planning School - Planning without school data keeps working"
    steps:
      - step: "Create department"
        action: "create"
        model: "hr.department"
        save_as: "department"
        values:
          name: "MPP Plain Department"
      - step: "Create planning without any school field"
        action: "create"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department.id"
          date_start: 2026-01-01
          date_end: 2026-12-31
      - step: "School fields stay empty and there are no workload lines"
        action: "assert"
        target: "planning"
        asserts:
          school_id:
            type: "value"
            operator: "is_falsy"
          school_branch_id:
            type: "value"
            operator: "is_falsy"
          academic_year_id:
            type: "value"
            operator: "is_falsy"
          curriculum_id:
            type: "value"
            operator: "is_falsy"
          workload_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

  - name: "Manpower Planning School - Academic year fills the planning period"
    steps:
      - step: "Create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "year"
        values:
          name: "MPP 2027/2028 Onchange"
          code: "/"
          date_start: "2027-07-01"
          date_end: "2028-06-30"
      - step: "Create department"
        action: "create"
        model: "hr.department"
        save_as: "department"
        values:
          name: "MPP Onchange Department"
      - step: "Pick the academic year in the planning form"
        action: "form"
        model: "manpower_planning"
        save_as: "planning"
        values:
          department_id: "REC: department"
          academic_year_id: "REC: year"
      - step: "The planning period follows the academic year"
        action: "assert"
        target: "planning"
        asserts:
          date_start:
            type: "value"
            expected: 2027-07-01
          date_end:
            type: "value"
            expected: 2028-06-30
