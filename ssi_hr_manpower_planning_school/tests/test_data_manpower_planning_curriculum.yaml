scenarios:
  - name: "Manpower Planning Curriculum - Create"
    steps:
      - step: "Create curriculum"
        action: "create"
        model: "manpower_planning_curriculum"
        save_as: "curriculum"
        values:
          name: "MPP Curriculum Create"
          code: "/"
          description: "National curriculum"
      - step: "Curriculum is created"
        action: "assert"
        target: "curriculum"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "MPP Curriculum Create"
          description:
            type: "value"
            expected: "National curriculum"
          active:
            type: "value"
            expected: true

  - name: "Manpower Planning Curriculum - Edit"
    steps:
      - step: "Create curriculum"
        action: "create"
        model: "manpower_planning_curriculum"
        save_as: "curriculum"
        values:
          name: "MPP Curriculum Edit"
          code: "/"
      - step: "Rename the curriculum and describe it"
        action: "write"
        target: "curriculum"
        values:
          name: "MPP Curriculum Edited"
          description: "Revised"
      - step: "Curriculum is updated"
        action: "assert"
        target: "curriculum"
        asserts:
          name:
            type: "value"
            expected: "MPP Curriculum Edited"
          description:
            type: "value"
            expected: "Revised"

  - name: "Manpower Planning Curriculum - Delete"
    steps:
      - step: "Create curriculum"
        action: "create"
        model: "manpower_planning_curriculum"
        save_as: "curriculum"
        values:
          name: "MPP Curriculum Delete"
          code: "/"
      - step: "Delete the curriculum"
        action: "unlink"
        target: "curriculum"
      - step: "Curriculum no longer exists"
        action: "search"
        model: "manpower_planning_curriculum"
        domain: [["name", "=", "MPP Curriculum Delete"]]
        save_as: "result"
        expect_count: 0
